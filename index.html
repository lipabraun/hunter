<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מפקדת ציד הווידאו 🏹</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 15px; border: 1px solid #ff9800; }
        .found-link { display: block; margin: 10px 0; padding: 15px; background: #4caf50; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h1>מפקדת הציד 🏹</h1>
        <p>לחץ על הכפתור כדי להפעיל את המארב:</p>
        <button onclick="activateHunter()" style="padding: 15px; background: #ff9800; border: none; color: white; font-size: 18px; border-radius: 10px;">🛡️ הפעל מארב</button>
        <div id="results" style="margin-top: 20px;"></div>
    </div>

    <script>
        function activateHunter() {
            alert('המארב פעיל! עכשיו תפעיל את הווידאו באתר היעד.');
            var patterns=['.m3u8','.mpd','manifest','playlist','master','chunk','.ts'];
            function checkUrl(url) {
                for(var i=0; i<patterns.length; i++) {
                    if(url.toLowerCase().includes(patterns[i])) {
                        var div = document.getElementById('results');
                        var a = document.createElement('a');
                        a.href = url;
                        a.className = 'found-link';
                        a.innerText = '🎬 נמצא וידאו! לחץ כאן להורדה/צפייה';
                        div.appendChild(a);
                        return true;
                    }
                }
                return false;
            }
            var oldOpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function(method,url) { checkUrl(url); oldOpen.apply(this,arguments); };
            var oldFetch = window.fetch;
            window.fetch = function(input,init) { var url = (typeof input==='string')?input:input.url; checkUrl(url); return oldFetch.apply(this,arguments); };
        }
    </script>
</body>
</html>
